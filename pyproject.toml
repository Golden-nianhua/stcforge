[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "stcforge"
version = "0.1.2"
description = "STC MCS-251 debugging and GDB integration"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = ["pyocd==0.43.1"]

[project.optional-dependencies]
usb = ["hidapi>=0.14,<1"]
uart = ["pyserial>=3.5,<4"]

[project.scripts]
stcforge = "stcforge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stcforge"]

[tool.uv]
package = true
