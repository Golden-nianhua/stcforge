# 配置族：0x0B，示例型号：STC12C5A08S2
# 支持型号：STC12C5A08S2、STC12C5A16S2、STC12C5A32S2、STC12C5A40S2、STC12C5A48S2、STC12C5A52S2、STC12C5A56S2、STC12C5A60S2、STC12C5A08AD、STC12C5A16AD、STC12C5A32AD、STC12C5A40AD、STC12C5A48AD、STC12C5A52AD、STC12C5A56AD、STC12C5A60AD、STC12C5A08CCP、STC12C5A16CCP、STC12C5A32CCP、STC12C5A40CCP、STC12C5A48CCP、STC12C5A52CCP、STC12C5A56CCP、STC12C5A60CCP、STC12C5A08X、STC12C5A16X、STC12C5A32X、STC12C5A40X、STC12C5A48X、STC12C5A52X、STC12C5A56X、STC12C5A60X、IAP12C5A08S2、IAP12C5A16S2、IAP12C5A32S2、IAP12C5A40S2、IAP12C5A48S2、IAP12C5A52S2、IAP12C5A56S2、IAP12C5A60S2、IAP12C5A62S2、IAP12C5A08AD、IAP12C5A16AD、IAP12C5A32AD、IAP12C5A40AD、IAP12C5A48AD、IAP12C5A52AD、IAP12C5A56AD、IAP12C5A60AD、IAP12C5A62AD、IAP12C5A08CCP、IAP12C5A16CCP、IAP12C5A32CCP、IAP12C5A40CCP、IAP12C5A48CCP、IAP12C5A52CCP、IAP12C5A56CCP、IAP12C5A60CCP、IAP12C5A62CCP、IAP12C5A08、IAP12C5A16、IAP12C5A32、IAP12C5A40、IAP12C5A48、IAP12C5A52、IAP12C5A56、IAP12C5A60、IAP12C5A62、STC12LE5A08S2、STC12LE5A16S2、STC12LE5A32S2、STC12LE5A40S2、STC12LE5A48S2、STC12LE5A52S2、STC12LE5A56S2、STC12LE5A60S2、STC12LE5A08AD、STC12LE5A16AD、STC12LE5A32AD、STC12LE5A40AD、STC12LE5A48AD、STC12LE5A52AD、STC12LE5A56AD、STC12LE5A60AD、STC12LE5A08CCP、STC12LE5A16CCP、STC12LE5A32CCP、STC12LE5A40CCP、STC12LE5A48CCP、STC12LE5A52CCP、STC12LE5A56CCP、STC12LE5A60CCP、STC12LE5A08X、STC12LE5A16X、STC12LE5A32X、STC12LE5A40X、STC12LE5A48X、STC12LE5A52X、STC12LE5A56X、STC12LE5A60X、IAP12LE5A08S2、IAP12LE5A16S2、IAP12LE5A32S2、IAP12LE5A40S2、IAP12LE5A48S2、IAP12LE5A52S2、IAP12LE5A56S2、IAP12LE5A60S2、IAP12LE5A62S2、IAP12LE5A08AD、IAP12LE5A16AD、IAP12LE5A32AD、IAP12LE5A40AD、IAP12LE5A48AD、IAP12LE5A52AD、IAP12LE5A56AD、IAP12LE5A60AD、IAP12LE5A62AD、IAP12LE5A08CCP、IAP12LE5A16CCP、IAP12LE5A32CCP、IAP12LE5A40CCP、IAP12LE5A48CCP、IAP12LE5A52CCP、IAP12LE5A56CCP、IAP12LE5A60CCP、IAP12LE5A62CCP、IAP12LE5A08、IAP12LE5A16、IAP12LE5A32、IAP12LE5A40、IAP12LE5A48、IAP12LE5A52、IAP12LE5A56、IAP12LE5A60、IAP12LE5A62
# 连接接口：UART ISP 用 "serial" 或 "link1d"；本族型号不支持原生 USB ISP。
# AiCube 内置 IRC 预置频率：22118400, 24000000, 27000000, 30000000, 33177600, 35000000, 36864000, 40000000, 44236800, 45158400
# IRC 输入框候选频率：22118400, 24000000, 27000000, 30000000, 33177600, 35000000, 36864000, 40000000, 44236800, 45158400
# IRC 频率可直接填写 Hz；上面两组列表分别对应 USB 自动选择预置值和用户输入候选值。
# 若本族同时支持串口动态校准，输入频率范围可能大于 USB 自动选择预置表；以本族实际界面为准。
#
# 下面的硬件选项已经填入默认值，按需修改或删除即可。
# 以上为 AiCube 的接口说明。stc-isp 实际写入支持请查 --list-models。
# 只下载程序、保留当前硬件选项时可设 modify_hardware_options = false。

model = "STC12C5A08S2"
if = "serial"
# 仅用于 if = "link1d"：true 由探针断电上电；false 用 port 指定 UART1，手动上电。
link1d_auto_power = true
# 普通串口或 Link1D 手动上电时填写端口，例如 COM3 或 /dev/ttyUSB0。
port = ""
image = "firmware.hex"

[hardware]
# modify_hardware_options
# 作用：本次下载修改硬件选项。
# 可选值：true=修改，false=保留当前配置。
# 默认：true
modify_hardware_options = true

# internal_irc_clock
# 作用：系统使用内部 IRC 时钟。
# 可选值：true=内部 IRC，false=外部时钟。
# 默认：false
internal_irc_clock = false

# oscillator_gain_high
# 作用：振荡器使用高放大增益。
# 可选值：true=高增益，false=低增益。
# 默认：true
oscillator_gain_high = true

# reset_pin_as_io
# 作用：复位脚用作 I/O 口。
# 可选值：true=用作 I/O，false=保持复位脚。
# 默认：false
reset_pin_as_io = false

# reset2_voltage_reset_enabled
# 作用：RESET2 电压低于 1.33V 时复位芯片。
# 可选值：true=启用，false=禁用。
# 默认：false
reset2_voltage_reset_enabled = false

# por_reset_delay_long
# 作用：上电复位使用较长延时。
# 可选值：true=较长延时，false=普通延时。
# 默认：true
por_reset_delay_long = true

# watchdog_por_enabled
# 作用：上电复位时由硬件自动启动看门狗。
# 可选值：true=自动启动，false=不自动启动。
# 默认：false
watchdog_por_enabled = false

# watchdog_prescale
# 作用：看门狗定时器分频系数。
# 可选值：2、4、8、16、32、64、128 或 256。
# 默认：256
watchdog_prescale = 256

# watchdog_stop_idle
# 作用：空闲状态时停止看门狗计数。
# 可选值：true=停止，false=继续计数。
# 默认：true
watchdog_stop_idle = true

# eeprom_erase_enabled
# 作用：下次下载用户程序时擦除用户 EEPROM 区。
# 可选值：true=擦除，false=保留。
# 默认：false
eeprom_erase_enabled = false

# cold_start_p10_p11_required
# 作用：下次冷启动时要求 P1.0/P1.1 同时为低电平才能下载。
# 可选值：true=要求，false=不要求。
# 默认：false
cold_start_p10_p11_required = false

# flash_blank_value
# 作用：Flash 空白区域的填充值。
# 可选值：0x00=填充 00，0xFF=填充 FF。
# 默认：0xFF
flash_blank_value = 0xFF

