# AiCube-ISP 6.97C 配置族模板
# 配置族：0x1F，示例型号：STC15F1K08S2
# 支持型号：STC15F1K08S2、STC15F1K16S2、STC15F1K24S2、STC15F1K32S2、STC15F1K40S2、STC15F1K48S2、STC15F1K56S2、STC15F1K60S2、IAP15F1K61S2、IRC15F1K63S2、STC15L1K08S2、STC15L1K16S2、STC15L1K24S2、STC15L1K32S2、STC15L1K40S2、STC15L1K48S2、STC15L1K56S2、STC15L1K60S2、IAP15L1K61S2、IRC15L1K63S2、STC15F1K08AS、STC15F1K16AS、STC15F1K24AS、STC15F1K32AS、STC15F1K40AS、STC15F1K48AS、STC15F1K56AS、STC15F1K60AS、IAP15F1K61AS、IRC15F1K63AS、STC15L1K08AS、STC15L1K16AS、STC15L1K24AS、STC15L1K32AS、STC15L1K40AS、STC15L1K48AS、STC15L1K56AS、STC15L1K60AS、IAP15L1K61AS、IRC15L1K63AS、STC15F1K08S、STC15F1K16S、STC15F1K24S、STC15F1K32S、STC15F1K40S、STC15F1K48S、STC15F1K56S、STC15F1K60S、IAP15F1K61S、IRC15F1K63S、STC15L1K08S、STC15L1K16S、STC15L1K24S、STC15L1K32S、STC15L1K40S、STC15L1K48S、STC15L1K56S、STC15L1K60S、IAP15L1K61S、IRC15L1K63S
# 连接接口：UART ISP 用 "serial" 或 "link1d"；本族型号不支持原生 USB ISP。
# AiCube 内置 IRC 预置频率：22118400, 24000000, 27000000, 30000000, 33177600, 35000000, 36864000, 40000000, 44236800, 45158400
# IRC 输入框候选频率：22118400, 24000000, 27000000, 30000000, 33177600, 35000000, 36864000, 40000000, 44236800, 45158400
# IRC 频率可直接填写 Hz；上面两组列表分别对应 USB 自动选择预置值和用户输入候选值。
# 若本族同时支持串口动态校准，输入频率范围可能大于 USB 自动选择预置表；以本族实际界面为准。
#
# 下面的硬件选项已经填入默认值，按需修改或删除即可。
# 以上为 AiCube 的接口说明。stc-isp 实际写入支持请查 --list-models。
# 只下载程序、保留当前硬件选项时可设 modify_hardware_options = false。

model = "STC15F1K08S2"
if = "serial"
# 仅用于 if = "link1d"：true 由探针断电上电；false 用 port 指定 UART1，手动上电。
link1d_auto_power = true
# 普通串口或 Link1D 手动上电时填写端口，例如 COM3 或 /dev/ttyUSB0。
port = ""
image = "firmware.hex"

[hardware]
# modify_hardware_options
# 作用：本次下载修改硬件选项。
# 可选值：true=修改，false=保留当前配置。
# 默认：true
modify_hardware_options = true

# irc_adjust_enabled
# 作用：本次下载调节 IRC 频率。
# 可选值：true=调节，false=不调节。
# 默认：true
irc_adjust_enabled = true

# internal_irc_clock
# 作用：系统使用内部 IRC 时钟。
# 可选值：true=内部 IRC，false=外部时钟。
# 默认：true
internal_irc_clock = true

# irc_hz
# 作用：启用 IRC 调节时的目标频率；关闭调节时忽略。
# 可选值：填写顶部列出的频率值，单位 Hz；选择内置预置或上次调节时忽略此值。
# 默认：24000000
irc_hz = 24000000

# oscillator_gain_high
# 作用：振荡器使用高放大增益。
# 可选值：true=高增益，false=低增益。
# 默认：true
oscillator_gain_high = true

# fast_download_enabled
# 作用：选择校准时使用的 ISP 时钟，不改变用户程序的 IRC 目标频率。
# 可选值：true=22.1184 MHz，false=11.0592 MHz。
# 默认：true
fast_download_enabled = true

# por_reset_delay_long
# 作用：上电复位使用较长延时。
# 可选值：true=较长延时，false=普通延时。
# 默认：true
por_reset_delay_long = true

# reset_pin_as_io
# 作用：复位脚用作 I/O 口。
# 可选值：true=用作 I/O，false=保持复位脚。
# 默认：true
reset_pin_as_io = true

# low_voltage_reset_enabled
# 作用：允许低压复位并禁止低压中断。
# 可选值：true=允许低压复位，false=不允许。
# 默认：true
low_voltage_reset_enabled = true

# low_voltage_threshold
# 作用：低压检测门槛电压。
# 可选值：0=最低门槛，1=较低门槛，2=中低门槛，3=中等门槛，4=中高门槛，5=较高门槛，6=高门槛，7=最高门槛。
# 默认：4
low_voltage_threshold = 4

# eeprom_disabled_at_low_voltage
# 作用：低压时禁止 EEPROM 操作。
# 可选值：true=禁止，false=允许。
# 默认：true
eeprom_disabled_at_low_voltage = true

# watchdog_por_enabled
# 作用：上电复位时由硬件自动启动看门狗。
# 可选值：true=自动启动，false=不自动启动。
# 默认：false
watchdog_por_enabled = false

# watchdog_prescale
# 作用：看门狗定时器分频系数。
# 可选值：2、4、8、16、32、64、128 或 256。
# 默认：256
watchdog_prescale = 256

# watchdog_stop_idle
# 作用：空闲状态时停止看门狗计数。
# 可选值：true=停止，false=继续计数。
# 默认：true
watchdog_stop_idle = true

# eeprom_erase_enabled
# 作用：下次下载用户程序时擦除用户 EEPROM 区。
# 可选值：true=擦除，false=保留。
# 默认：false
eeprom_erase_enabled = false

# reset_pin_level
# 作用：复位脚上电复位电平。
# 可选值：0=低电平，1=高电平。
# 默认：0
reset_pin_level = 0

# uart1_remap_p37_level
# 作用：UART1 切换到 P3.6/P3.7 后的 P3.7 电平。
# 可选值：0=低电平，1=高电平。
# 默认：0
uart1_remap_p37_level = 0

# uart1_p37_push_pull
# 作用：UART1 的 P3.7 使用推挽输出。
# 可选值：true=推挽，false=普通模式。
# 默认：false
uart1_p37_push_pull = false

# cold_start_p32_p33_required
# 作用：下次冷启动时要求 P3.2/P3.3 同时为低电平才能下载。
# 可选值：true=要求，false=不要求。
# 默认：false
cold_start_p32_p33_required = false

# append_test_parameters
# 作用：在程序区末尾追加芯片测试参数（占用程序 Flash）。
# 可选值：true=追加，false=不追加。
# 默认：false
append_test_parameters = false

# isp_rs485_wait_time
# 作用：ISP 等待 RS485 下载命令的时间。
# 可选值：0=不等待；现有逆向资料未恢复其它固定时间档位。
# 默认：0
isp_rs485_wait_time = 0

# eeprom_fill_ff
# 作用：本次将整个 EEPROM 区填充为 FF；不可同时提供 EEPROM 数据。
# 可选值：true=填充，false=不填充。
# 默认：false
eeprom_fill_ff = false

# flash_blank_value
# 作用：Flash 空白区域的填充值。
# 可选值：0x00=填充 00，0xFF=填充 FF。
# 默认：0xFF
flash_blank_value = 0xFF

